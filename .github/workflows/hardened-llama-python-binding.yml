name: Hardened llama-cpp-python source smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/harden_llama_cpp_python_source.py
      - tests/test_harden_llama_cpp_python_source.py
      - .github/workflows/hardened-llama-python-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patched-macos-wheel:
    name: Pinned 0.3.36 no-diskcache wheel on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify immutable upstream sdist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tarfile
          import urllib.request

          from scripts.harden_llama_cpp_python_source import SDIST_SHA256

          root = Path(os.environ["RUNNER_TEMP"]) / "hardened-llama-python"
          root.mkdir(parents=True, exist_ok=True)
          metadata_url = "https://pypi.org/pypi/llama-cpp-python/0.3.36/json"
          with urllib.request.urlopen(metadata_url, timeout=30) as response:
              release = json.load(response)
          matches = [item for item in release["urls"]
                     if item["filename"] == "llama_cpp_python-0.3.36.tar.gz"]
          assert len(matches) == 1, "upstream sdist identity changed"
          selected = matches[0]
          assert selected["digests"]["sha256"] == SDIST_SHA256
          archive = root / "upstream.tar.gz"
          digest = hashlib.sha256()
          total = 0
          with urllib.request.urlopen(selected["url"], timeout=180) as response:
              with archive.open("wb") as output:
                  while chunk := response.read(1024 * 1024):
                      total += len(chunk)
                      assert total < 120 * 1024 * 1024, "oversized source archive"
                      digest.update(chunk)
                      output.write(chunk)
          assert digest.hexdigest() == SDIST_SHA256, "upstream SHA256 mismatch"
          assert hasattr(tarfile, "data_filter"), "safe extraction unavailable"
          with tarfile.open(archive) as package:
              entries = package.getmembers()
              assert len(entries) < 20000, "oversized source tree"
              assert sum(e.size for e in entries if e.isfile()) < 1024**3
              assert all(e.name.startswith("llama_cpp_python-0.3.36/")
                         for e in entries), "unexpected archive layout"
              package.extractall(root, filter="data")
          print("VERIFIED immutable upstream llama-cpp-python 0.3.36 source")
          PY
      - name: Apply fail-closed cache patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/harden_llama_cpp_python_source.py \
            "$RUNNER_TEMP/hardened-llama-python/llama_cpp_python-0.3.36"
      - name: Build native Python wheel
        env:
          CMAKE_ARGS: "-DGGML_METAL=on"
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "build==1.2.2.post1"
          python -m build --wheel \
            --outdir "$RUNNER_TEMP/hardened-llama-python/wheels" \
            "$RUNNER_TEMP/hardened-llama-python/llama_cpp_python-0.3.36"
      - name: Fresh venv import, metadata and fail-closed disk cache
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/hardened-llama-python/venv"
          PYTHON="$RUNNER_TEMP/hardened-llama-python/venv/bin/python"
          "$PYTHON" -m pip install --no-cache-dir \
            "$RUNNER_TEMP/hardened-llama-python"/wheels/*.whl
          "$PYTHON" - <<'PY'
          from importlib import metadata, util
          import llama_cpp

          dist = metadata.distribution("llama-cpp-python")
          assert dist.version == "0.3.36+korgis.1"
          assert not any("diskcache" in name.lower() for name in (dist.requires or []))
          assert util.find_spec("diskcache") is None, "vulnerable package installed"
          assert llama_cpp.Llama is not None
          assert llama_cpp.LlamaRAMCache is not None
          try:
              llama_cpp.LlamaDiskCache()
          except RuntimeError as exc:
              assert "CVE-2025-69872" in str(exc)
          else:
              raise AssertionError("disk cache unexpectedly enabled")
          print("PASS: native import without diskcache; RAM cache preserved")
          PY
      - name: Remove isolated build products
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/hardened-llama-python"
