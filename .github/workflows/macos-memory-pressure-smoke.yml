name: Native macOS Memory Pressure Smoke

on:
  pull_request:
    paths:
      - "scripts/macos/memory_pressure.swift"
      - "scripts/build_artifacts.py"
      - "src/local_llm_server/native_memory_pressure.py"
      - "src/local_llm_server/resource_manager.py"
      - "src/local_llm_server/host_pressure_monitor.py"
      - ".github/workflows/macos-memory-pressure-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-lifecycle:
    name: Compile and reap native Dispatch helper
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile Swift Dispatch source on macOS
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O scripts/macos/memory_pressure.swift -o "$RUNNER_TEMP/korgis-memory-pressure"
          test -x "$RUNNER_TEMP/korgis-memory-pressure"
      - name: Verify native helper handshake and parent-EOF exit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          helper = Path(os.environ["RUNNER_TEMP"]) / "korgis-memory-pressure"
          process = subprocess.Popen(
              [str(helper)],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              close_fds=True,
          )
          try:
              assert process.stdout is not None
              assert process.stdout.readline().strip() == "ready"
              assert process.stdin is not None
              process.stdin.close()
              assert process.wait(timeout=5) == 0
          finally:
              if process.poll() is None:
                  process.kill()
                  process.wait(timeout=5)
              if process.stdout:
                  process.stdout.close()
              if process.stderr:
                  process.stderr.close()
          PY
      - name: Verify optional native signed bundle construction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/korgis-native-build-venv"
          "$RUNNER_TEMP/korgis-native-build-venv/bin/python" -m pip install \
            'build==1.2.2.post1' 'setuptools>=68.0' wheel
          "$RUNNER_TEMP/korgis-native-build-venv/bin/python" scripts/build_artifacts.py \
            --with-native-pressure-helper \
            --native-sign-identity - \
            --output-root "$RUNNER_TEMP/korgis-native-bundles"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "korgis-native-bundles" / "builds"
          manifests = list(root.glob("*/*/build-manifest.json"))
          assert len(manifests) == 1, manifests
          manifest = json.loads(manifests[0].read_text())
          helper = manifest["native_pressure_helper"]
          assert helper["signature_kind"] == "adhoc"
          assert helper["architecture"]
          artifact = manifests[0].parent / "package" / helper["artifact"]
          assert artifact.is_file()
          assert any(item["name"] == helper["artifact"] for item in manifest["artifacts"])
          PY
      - name: Remove temporary helper
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/korgis-memory-pressure"
