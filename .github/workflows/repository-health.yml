name: Repository Health

on:
  pull_request:
    branches: [dev, main, master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main, master]

permissions:
  contents: read

concurrency:
  group: local-llm-health-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-health:
    name: Structural repository health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Structural baseline and contracts
        run: |
          python3 scripts/verify_repository.py --skip-specialists
          python3 scripts/verify_operations.py
          python3 scripts/verify_e2e.py
          python3 scripts/verify_stage_environment_policy.py
          python3 scripts/verify_docs.py
          python3 scripts/verify_agent_context.py
          python3 scripts/select_validation_profile.py --self-test

# Expensive L1/L2 specialist fitness, artifact-lifecycle stress and hosted
# performance regression are owned by the stage/risk-aware FULL gate in ci.yml.
# Representative/target Apple Silicon evidence is a RELEASE gate, not a PR-to-dev gate.
