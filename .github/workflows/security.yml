name: Security Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.8.13"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install "uv==${UV_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
      - run: python scripts/verify_security_exceptions.py
      - run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file audited-requirements.txt
          python -m pip_audit --requirement audited-requirements.txt --no-deps --disable-pip --ignore-vuln PYSEC-2026-2447

  node-dependencies:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm}
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high

# Dependency/security-sensitive PR and release gating is selected in ci.yml;
# this workflow preserves independent scheduled/manual auditing without duplication.
