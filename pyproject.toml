[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-server"
version = "0.4.0"
description = "Resource-aware local AI control plane for product-grade inference"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "local-llm-server contributors" }]

dependencies = [
    "llama-cpp-python>=0.3.0",
    "pyyaml>=6.0",
    "fastapi>=0.139.2",
    "starlette>=1.3.1",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "huggingface-hub>=0.34.0,<2.0.0",
    "build==1.2.2.post1",
    "setuptools>=68.0",
    "wheel",
]
mlx = ["mlx-lm>=0.31.0", "huggingface-hub>=0.34.0,<2.0.0"]
vision = ["mlx-vlm>=0.6.4,<0.7.0", "huggingface-hub>=0.34.0,<2.0.0"]
image = [
    "torch>=2.4.0",
    "diffusers>=0.40.0,<0.41.0",
    "transformers>=5.17.0",
    "accelerate>=1.0.0",
    "pillow>=10.0.0",
    "huggingface-hub>=0.34.0,<2.0.0",
]
audio = ["soundfile>=0.12.0", "numpy>=1.24.0"]

[project.scripts]
local-llm = "local_llm_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_llm_server = ["models_registry.yaml", "static/*"]
